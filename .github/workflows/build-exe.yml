name: 打包成 Windows exe

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包成 exe
        run: |
          pyinstaller --onefile --windowed --name 批次蓋章工具 stamp_tool.py

      - name: 上傳打包好的 exe
        uses: actions/upload-artifact@v4
        with:
          name: 批次蓋章工具-exe
          path: dist/批次蓋章工具.exe
